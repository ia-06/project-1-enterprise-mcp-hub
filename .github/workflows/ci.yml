name: Enterprise Hub CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache-dependency-path: mcp-server/go.sum

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Verify Go Backend Compilation
      working-directory: ./mcp-server
      run: |
        go mod download
        go build -v -o mcp-hub ./cmd/server

    - name: Verify Next.js Frontend Compilation
      run: |
        npm ci
        npm run build
