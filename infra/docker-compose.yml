services:
  # ---------------------------------------------------------------
  # PostgreSQL: local development database
  # Stores Sales data (customers + orders) and Supabase-compatible
  # cache_accounts table for the Salesforce fallback engine.
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mcp_hub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mcp_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-run migrations on first startup
      - ../db/migrations/001_create_sales_tables.sql:/docker-entrypoint-initdb.d/001_create_sales_tables.sql:ro
      - ../db/seed/sales_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d mcp_hub" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------
  # MCP Server: Go backend implementing the Enterprise Hub
  # ---------------------------------------------------------------
  mcp_server:
    build:
      context: ../mcp-server
    container_name: mcp_hub_server
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    environment:
      # Override DB_URL to use Docker network instead of localhost
      DB_URL: "postgres://postgres:postgres@postgres:5432/mcp_hub?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------
  # pgAdmin (optional): browser-based DB GUI for local dev
  # Accessible at http://localhost:5050
  # Default login: admin@mcp-hub.dev / admin
  # ---------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mcp_hub_pgadmin
    restart: unless-stopped
    profiles:
      - tools # Only started with: docker compose --profile tools up
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mcp-hub.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
